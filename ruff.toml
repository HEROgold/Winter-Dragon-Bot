indent-width = 4
line-length = 128
target-version = "py315"
unsafe-fixes = true

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[lint]
exclude = ["build", "dist", "venv"]
select = ["ALL"]
ignore = [
  "D105",
  "TD005", # We won't require an GH-issue.
]

[lint.isort]
required-imports = [
  "from __future__ import annotations",
]
lines-after-imports = 2

[lint.flake8-type-checking]
# pydantic evaluates annotations at runtime, so field-type imports on these models must stay
# concrete (not moved into a TYPE_CHECKING block) or validation fails at import time.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "wd_discord.models.DiscordModel",
]
