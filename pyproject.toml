[project]
name = "winter-dragon"
version = "0.3.0"
description = "A versatile Discord bot with moderation, utility, and entertainment features"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  {name = "HEROgold", email = "martijnwieringa28@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Internet",
  "Framework :: AsyncIO"
]
dependencies = [
  "bs4>=0.0.2",
  "cassiopeia>=5.2.0; python_full_version < '3.15.0a0'",
  "confkit==2.0.0",
  "discord-ext-prometheus>=0.2.1",
  "discord-py>=2.7.1",
  "herogold>=3.0.0",
  "matplotlib>=3.10.8; python_full_version < '3.15.0a0'",
  "psutil>=7.2.2",
  "psycopg>=3.2.0",
  "redis>=7.4.0",
  "requests>=2.33.1",
  "rq>=2.7.0",
  "sentry-sdk>=2.58.0",
  "sqlmodel>=0.0.38",
  "wd-bot",
  "wd-config",
  "wd-core",
  "wd-db",
  "wd-discord",
  "wd-errors",
  "wd-types",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.136.0",
  "jinja2>=3.1.6",
  # Required by FastAPI Form() parsing in dashboard/HTMX endpoints.
  "python-multipart>=0.0.20",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "wd-core",
    "wd-discord",
    "wd-bot",
    "wd-db",
    "wd-errors",
    "wd-types",
    "wd-config",
]

[tool.uv.sources]
wd-types = { workspace = true }
wd-bot = { workspace = true }
wd-core = { workspace = true }
wd-db = { workspace = true }
wd-discord = { workspace = true }
wd-errors = { workspace = true }
wd-config = { workspace = true }
