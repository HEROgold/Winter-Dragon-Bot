[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "hypothesis>=6.170.9",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "zensical>=0.0.72"
]
docs = [
  "zensical>=0.0.72"
]

[project]
name = "winter-dragon"
version = "0.4.1"
description = "A versatile Discord bot with moderation, utility, and entertainment features"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "HEROgold" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Internet",
  "Framework :: AsyncIO"
]
dependencies = [
  "wd-bot",
  "wd-config",
  "wd-core",
  "wd-db",
  "wd-discord",
  "wd-errors",
  "wd-types",
  "wd-cogs",
  "herogold==5.0.0",
  "httpxyz>=0.42.1",
  "pydantic>=2.14.1",
  "matplotlib>=3.11.2",
  "fastapi>=0.162.0",
  "jinja2>=3.1.6",
  "uvicorn>=0.54.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.32",
  "tzdata>=2026.5",
  "alembic>=1.20.1",
  "psycopg[binary]>=3.3.6"
]

[tool.pytest.ini_options]
# Single config for the whole uv workspace. Add each package's tests dir here as it
# gains tests; importlib mode keeps same-named test files across packages from clashing.
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = [
  "wd-discord/tests",
  "wd-bot/tests",
  "wd-config/tests",
  "wd-db/tests",
  "tests/archive"
  # ...add other wd-* packages as they get tests
]
markers = [
  "integration: live tests that hit external services (need credentials; auto-skip otherwise)"
]

[tool.uv]
package = true

[tool.uv.sources]
wd-types = { workspace = true }
wd-bot = { workspace = true }
wd-core = { workspace = true }
wd-db = { workspace = true }
wd-discord = { workspace = true }
wd-errors = { workspace = true }
wd-config = { workspace = true }
wd-cogs = { workspace = true }

[tool.uv.workspace]
members = [
  "wd-core",
  "wd-discord",
  "wd-bot",
  "wd-db",
  "wd-errors",
  "wd-types",
  "wd-config",
  "wd-cogs"
]
