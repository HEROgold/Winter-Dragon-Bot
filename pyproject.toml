[project]
name = "winter-dragon"
version = "0.3.0"
description = "A versatile Discord bot with moderation, utility, and entertainment features"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  {name = "HEROgold"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
  "Topic :: Internet",
  "Framework :: AsyncIO"
]
dependencies = [
  "discord-py",
  "wd-bot",
  "wd-config",
  "wd-core",
  "wd-db",
  "wd-discord",
  "wd-errors",
  "wd-types",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "wd-core",
    "wd-discord",
    "wd-bot",
    "wd-db",
    "wd-errors",
    "wd-types",
    "wd-config",
    "discord.py",
]

[tool.uv.sources]
wd-types = { workspace = true }
wd-bot = { workspace = true }
wd-core = { workspace = true }
wd-db = { workspace = true }
wd-discord = { workspace = true }
wd-errors = { workspace = true }
wd-config = { workspace = true }
discord-py = { workspace = true }
