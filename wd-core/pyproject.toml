[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "wd-core"
version = "0.1.0"
description = "Core features and utilities for Winter Dragon"
readme = "README.md"
authors = [
  { name = "HEROgold", email = "martijnwieringa28@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
  "wd-config",
  "wd-discord",
  "wd-types"
]

[tool.uv.sources]
wd-config = { workspace = true }
wd-discord = { workspace = true }
wd-types = { workspace = true }
