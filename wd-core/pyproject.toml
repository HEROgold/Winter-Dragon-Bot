[project]
name = "wd-core"
version = "0.1.0"
description = "Core features and utilities for Winter Dragon"
readme = "README.md"
authors = [
    { name = "HEROgold", email = "martijnwieringa28@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "sentry-sdk>=2.61.0",
    "wd-config",
    "wd-discord",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
wd-config = { workspace = true }
wd-discord = { workspace = true }
