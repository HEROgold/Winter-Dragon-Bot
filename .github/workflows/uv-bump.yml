name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # bump-by-label rebuilds its branch from origin/main

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Bump Version
        uses: HEROgold/bump-by-label@79f350450535cf4dc99429a483ff53df22acb128 # v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: 'uv version --no-sync --bump'
          validate: 'uv version --short'
          base_branch: 'main'
