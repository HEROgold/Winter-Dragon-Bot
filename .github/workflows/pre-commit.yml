name: Pre-commit

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2

jobs:
  run-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The pyrefly hook resolves imports from .venv; without it every third-party and workspace import is missing.
      - name: Install the workspace
        run: uv sync --all-packages --frozen

      - name: Run pre-commit
        run: |
          uvx prek run --all-files --color always --show-diff-on-failure
