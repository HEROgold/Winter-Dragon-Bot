name: Pre-commit

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2

jobs:
  run-pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      # The pyrefly hook resolves imports from .venv; without it every third-party and workspace import is missing.
      - name: Install the workspace
        run: uv sync --all-packages --frozen

      - name: Run pre-commit
        run: |
          uvx prek run --all-files --color always --show-diff-on-failure
