name: Sentry issues

# Opens a GitHub issue for each new unresolved error in Sentry. Sentry's own "create GitHub issue" alert action
# needs a paid plan, so this polls the Sentry API instead. Warnings (the wd-discord unknown-field telemetry) are left out.
# Only issues first seen in the last 6h are picked up (scheduled runs can start late); the body marker stops repeats.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A personal token with event:read; the release token (SENTRY_AUTH_TOKEN) can only make releases.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ISSUES_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Open an issue per new Sentry error
        run: |
          set -euo pipefail
          gh label create sentry --color 362D59 --description "Opened from a Sentry error" 2>/dev/null || true

          curl -sSf -G -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/issues/" \
            --data-urlencode "query=is:unresolved level:[error,fatal] firstSeen:-6h" \
            --data-urlencode "limit=100" > sentry.json

          # Every issue this workflow opened carries "sentry-issue:<id>" in its body.
          gh issue list --label sentry --state all --limit 1000 --json body \
            --jq '.[].body | capture("sentry-issue:(?<id>[0-9]+)").id' > known.txt || true

          jq -c '.[]' sentry.json | while read -r issue; do
            id=$(jq -r .id <<<"$issue")
            grep -qx "$id" known.txt && continue
            short=$(jq -r .shortId <<<"$issue")
            title=$(jq -r .title <<<"$issue" | cut -c1-200)
            body=$(jq -r '"**Sentry:** [\(.shortId)](\(.permalink))\n**Culprit:** `\(.culprit // "-")`\n**Events:** \(.count) · first seen \(.firstSeen) · last seen \(.lastSeen)\n\n```\n\(.metadata.value // .title)\n```\n\n<!-- sentry-issue:\(.id) -->"' <<<"$issue")
            gh issue create --title "[$short] $title" --body "$body" --label bug --label sentry
            echo "$id" >> known.txt
          done
