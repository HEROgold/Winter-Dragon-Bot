name: Auto-release

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write  # Pushes the image to ghcr.io
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version_changed: ${{ steps.version-check.outputs.version_changed }}
      version: ${{ steps.version-check.outputs.current_version }}
      # Empty when the version didn't change, so the deploy job skips.
      digest: ${{ steps.image.outputs.digest }}

    steps:
    - uses: actions/checkout@v7
      with:
        # The commit the Test run passed, not whatever main points at by now.
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0  # Needed to get all tags for version comparison

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: .python-version

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.2
      with:
        version: "latest"

    - name: Check if version changed
      id: version-check
      run: |
        # Get current version from pyproject.toml
        CURRENT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

        # Check if this version already has a tag
        if git tag --list | grep -q "^v$CURRENT_VERSION$"; then
          echo "version_changed=false" >> $GITHUB_OUTPUT
          echo "Version v$CURRENT_VERSION already exists as a tag"
        else
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "New version v$CURRENT_VERSION detected - will create release"
        fi

    - name: Set up Docker Buildx
      if: steps.version-check.outputs.version_changed == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: steps.version-check.outputs.version_changed == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The deploy target only accepts ghcr.io/herogold/winter-dragon-bot pinned by
    # digest (deploy/verifier.toml), so renaming the image means changing that too.
    - name: Build and push the image
      id: image
      if: steps.version-check.outputs.version_changed == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ghcr.io/herogold/winter-dragon-bot:v${{ steps.version-check.outputs.current_version }}
          ghcr.io/herogold/winter-dragon-bot:sha-${{ github.event.workflow_run.head_sha || github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=v${{ steps.version-check.outputs.current_version }}
          org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create GitHub Release
      if: steps.version-check.outputs.version_changed == 'true'
      uses: softprops/action-gh-release@v3
      with:
        target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
        tag_name: v${{ steps.version-check.outputs.current_version }}
        name: Release v${{ steps.version-check.outputs.current_version }}
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Create Sentry release
      if: steps.version-check.outputs.version_changed == 'true'
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: production
        release: v${{ steps.version-check.outputs.current_version }}  # The version the deploy job sends

  # Notifies https://deploy.herogold.nl/hooks/winter-dragon with an OIDC token.
  # The verifier there runs deploy/deploy-wd.sh. See deploy/README.md.
  deploy:
    needs: new-release
    if: ${{ needs.new-release.outputs.version_changed == 'true' && needs.new-release.outputs.digest != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency: deploy-production
    permissions:
      id-token: write  # Needed for deploy-notifier's OIDC token
    steps:
    - name: Notify the server
      uses: HEROgold/deploy-notifier@v1
      with:
        url: ${{ vars.DEPLOY_URL }}
        image: ghcr.io/herogold/winter-dragon-bot@${{ needs.new-release.outputs.digest }}
        version: v${{ needs.new-release.outputs.version }}
        timeout: 900  # Matches the verifier's [apps.winter-dragon] timeout

    # PUBLIC_URL is the production environment's dashboard address. The landing
    # page reads the database, so a 200 means the deployed stack serves. The
    # first request for a new host can wait on a TLS certificate, so this
    # retries for about two minutes; --max-time ends a request that hangs.
    - name: Smoke test the live dashboard
      if: ${{ vars.PUBLIC_URL != '' }}
      env:
        PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      run: >-
        curl --fail --silent --show-error --output /dev/null --max-time 10
        --retry 12 --retry-all-errors --retry-delay 10 "$PUBLIC_URL/"
