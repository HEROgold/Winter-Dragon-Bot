name: Auto-release

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version_changed: ${{ steps.version-check.outputs.version_changed }}
      version: ${{ steps.version-check.outputs.current_version }}
      # The image build (#293) is the step with id `image`. Until it exists this
      # is empty, and the deploy job below skips.
      digest: ${{ steps.image.outputs.digest }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Needed to get all tags for version comparison

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.*"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "latest"

    - name: Check if version changed
      id: version-check
      run: |
        # Get current version from pyproject.toml
        CURRENT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

        # Check if this version already has a tag
        if git tag --list | grep -q "^v$CURRENT_VERSION$"; then
          echo "version_changed=false" >> $GITHUB_OUTPUT
          echo "Version v$CURRENT_VERSION already exists as a tag"
        else
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "New version v$CURRENT_VERSION detected - will create release"
        fi

    - name: Create GitHub Release
      if: steps.version-check.outputs.version_changed == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.version-check.outputs.current_version }}
        name: Release v${{ steps.version-check.outputs.current_version }}
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Create Sentry release
      if: steps.version-check.outputs.version_changed == 'true'
      uses: getsentry/action-release@v3
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      with:
        environment: production
        release: v${{ steps.version-check.outputs.current_version }}  # The version the deploy job sends

  # Notifies https://deploy.herogold.nl/hooks/winter-dragon with an OIDC token.
  # The verifier there runs deploy/deploy-wd.sh. See deploy/README.md.
  deploy:
    needs: new-release
    if: ${{ needs.new-release.outputs.version_changed == 'true' && needs.new-release.outputs.digest != '' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    permissions:
      id-token: write  # Needed for deploy-notifier's OIDC token
    steps:
    - name: Notify the server
      uses: HEROgold/deploy-notifier@v1
      with:
        url: ${{ vars.DEPLOY_URL }}
        image: ghcr.io/herogold/winter-dragon-bot@${{ needs.new-release.outputs.digest }}
        version: v${{ needs.new-release.outputs.version }}
        timeout: 900  # Matches the verifier's [apps.winter-dragon] timeout
    # TODO: once #293 decides whether Traefik routes the dashboard, add a smoke
    # test here that retries its health URL, like nota's deploy workflow.
