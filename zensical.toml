[project]
site_name = "Winter Dragon"
site_description = "A versatile Discord bot with moderation, utility, and entertainment features"
site_author = "HEROgold"
site_url = "https://herogold.github.io/Winter-Dragon-Bot"
repo_url = "https://github.com/HEROgold/Winter-Dragon-Bot"
repo_name = "HEROgold/Winter-Dragon-Bot"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Features (main branch)" = [
    { "Overview" = "features/index.md" },
    { "Bot Core" = "features/bot-core.md" },
    { "Moderation & Logging" = "features/moderation.md" },
    { "Server Management" = "features/server-management.md" },
    { "Games" = "features/games.md" },
    { "User Tools" = "features/user-tools.md" },
    { "Platform & Services" = "features/platform.md" },
  ] },
  { "Getting Started" = "guide/getting-started.md" },
  { "Development" = [
    { "Architecture" = "dev/architecture.md" },
    { "Setup" = "dev/setup.md" },
    { "Database" = "dev/database.md" },
  ] },
  # docs/reference/ is generated by scripts/generate_api_reference.py; add a page here when it creates one.
  { "API Reference" = [
    { "Index" = "reference/index.md" },
    { "winter_dragon" = [
      { "winter_dragon" = "reference/winter-dragon.md" },
      { "winter_dragon.cogs" = "reference/winter-dragon.cogs.md" },
    ] },
    { "wd_bot" = "reference/wd-bot.md" },
    { "wd_discord" = [
      { "wd_discord" = "reference/wd-discord.md" },
      { "wd_discord.entities" = "reference/wd-discord.entities.md" },
      { "wd_discord.resources" = "reference/wd-discord.resources.md" },
      { "wd_discord.gateway" = "reference/wd-discord.gateway.md" },
      { "wd_discord.errors" = "reference/wd-discord.errors.md" },
      { "wd_discord.utils" = "reference/wd-discord.utils.md" },
    ] },
    { "wd_config" = "reference/wd-config.md" },
    { "wd_db" = [
      { "wd_db" = "reference/wd-db.md" },
      { "wd_db.extension" = "reference/wd-db.extension.md" },
      { "wd_db.errors" = "reference/wd-db.errors.md" },
      { "wd_db.extras" = "reference/wd-db.extras.md" },
    ] },
    { "wd_core" = [
      { "wd_core" = "reference/wd-core.md" },
      { "wd_core.command" = "reference/wd-core.command.md" },
      { "wd_core.ui" = "reference/wd-core.ui.md" },
    ] },
    { "wd_errors" = [
      { "wd_errors" = "reference/wd-errors.md" },
      { "wd_errors.handlers" = "reference/wd-errors.handlers.md" },
    ] },
    { "wd_types" = "reference/wd-types.md" },
    { "wd_cogs (legacy)" = [
      { "wd_cogs" = "reference/wd-cogs.md" },
      { "wd_cogs.bot_extension" = "reference/wd-cogs.bot_extension.md" },
      { "wd_cogs.games" = "reference/wd-cogs.games.md" },
      { "wd_cogs.server" = "reference/wd-cogs.server.md" },
      { "wd_cogs.tournament" = "reference/wd-cogs.tournament.md" },
      { "wd_cogs.user" = "reference/wd-cogs.user.md" },
      { "wd_cogs.utility" = "reference/wd-cogs.utility.md" },
    ] },
  ] },
  { "Planned" = "planned.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.indexes",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.select",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/HEROgold/Winter-Dragon-Bot"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.use_pygments = true
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
