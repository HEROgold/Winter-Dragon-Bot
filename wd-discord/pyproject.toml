[project]
name = "wd-discord"
version = "0.1.0"
description = "Discord API client for Winter Dragon"
readme = "README.md"
authors = [
    { name = "HEROgold", email = "martijnwieringa28@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "herogold>=3.3.0",
    "httpxyz>=0.31.2",
    "pydantic>=2.13.4",
    "websockets>=16.0",
    "wd-config",
    "sentry-sdk>=2.61.0",
]

[tool.uv.sources]
wd-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# NOTE: pytest is configured once for the whole workspace in the root pyproject.toml.
