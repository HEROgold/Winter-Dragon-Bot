# This is a reference copy of the winter-dragon app in the deploy verifier's
# config. The live one is ~/deploy-notifier/verifier/config.toml on the VPS.
# Changing the app name, the image name or a pin below means editing it there and
# recreating the verifier; keep this copy in step.

[apps.winter-dragon]
command = ["/home/herogold/Winter-Dragon-Bot/deploy-wd.sh"]
timeout = 900
image_pattern = '^ghcr\.io/herogold/winter-dragon-bot@sha256:[0-9a-f]{64}$'
audience = "https://deploy.herogold.nl"
repository_id = "581373620" # HEROgold/Winter-Dragon-Bot
repository_owner_id = "21345384" # HEROgold
environment = "production"
