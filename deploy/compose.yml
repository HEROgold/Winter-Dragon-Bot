# The production stack on the VPS, as ~/Winter-Dragon-Bot/compose.yml. It runs the CI-built image
# pinned by digest; the dev stack that builds from source is ../docker-compose.yml. deploy-wd.sh runs
#   docker compose -f compose.yml --env-file .env --env-file .env.deploy up -d --wait bot web
# .env holds DB_PASSWORD (it must match database.ini's password). .env.deploy holds WD_IMAGE and
# WD_VERSION, written by deploy-wd.sh. See README.md.
#
# Each ini file must exist before `up`, or Docker creates an empty directory in its place.
# The project name keeps the volume names from the old stack (winter-dragon-bot_redis_data).
name: winter-dragon-bot

x-app: &app
  image: ${WD_IMAGE:?WD_IMAGE is set in .env.deploy by deploy-wd.sh}
  environment:
    # sentry_sdk reads SENTRY_RELEASE when init sets no release.
    SENTRY_RELEASE: ${WD_VERSION:-}
  networks:
    - default
  # The app writes only to its bind mounts (logs/ and the ini files) and /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-app-volumes: &app-volumes
  - ./logs:/app/logs
  - ./bot.ini:/app/bot.ini
  - ./config.ini:/app/config.ini
  - ./cogs.ini:/app/cogs.ini
  - ./database.ini:/app/database.ini
  - ./sentry.ini:/app/sentry.ini

services:

  redis:
    # Pinned by digest like the app. Bump: docker buildx imagetools inspect redis:8.2.4-alpine3.22
    image: redis:8.2.4-alpine3.22@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  postgres:
    # Pinned by digest like the app. Bump: docker buildx imagetools inspect postgres:14-alpine
    image: &postgres-image postgres:14-alpine@sha256:50fce0c9c54c43d8b02ce16cb9daff75eb94c09c4ee3d41c157852ebd9700c80
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is set in .env}
      POSTGRES_DB: winter_dragon
      PGUSER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d winter_dragon"]
      interval: 5s
      timeout: 30s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

  # Dumps the database before the migrations run; every `up` takes one.
  backup:
    image: *postgres-image
    command: ["sh", "/backup-db.sh", "pre-migrate"]
    environment: &backup-env
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is set in .env}
      PGDATABASE: winter_dragon
      KEEP: "14"
    volumes: &backup-volumes
      - ./backups:/backups
      - ./backup-db.sh:/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  # Applies pending migrations once the backup is taken; bot and web wait for it.
  migrate:
    <<: *app
    command: python -m winter_dragon.migrations upgrade
    volumes: *app-volumes
    depends_on:
      backup:
        condition: service_completed_successfully
    restart: "no"

  # A dump a day, the newest 14 kept, next to the pre-migration ones.
  backup-daily:
    image: *postgres-image
    command: ["sh", "-c", "while true; do sh /backup-db.sh daily; sleep 86400; done"]
    environment: *backup-env
    volumes: *backup-volumes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  bot:
    <<: *app
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The dashboard, public at https://dragon.herogold.nl through Traefik. dashboard.ini needs
  # host = 0.0.0.0, port = 8001 and public_url = https://dragon.herogold.nl. It has no host port.
  web:
    <<: *app
    command: python -m winter_dragon.web
    volumes:
      - ./logs:/app/logs
      - ./bot.ini:/app/bot.ini
      - ./config.ini:/app/config.ini
      - ./cogs.ini:/app/cogs.ini
      - ./database.ini:/app/database.ini
      - ./sentry.ini:/app/sentry.ini
      - ./dashboard.ini:/app/dashboard.ini
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.winter-dragon.rule: Host(`dragon.herogold.nl`)
      traefik.http.routers.winter-dragon.entrypoints: websecure
      traefik.http.routers.winter-dragon.tls: "true"
      traefik.http.routers.winter-dragon.tls.certresolver: mytlschallenge
      traefik.http.services.winter-dragon.loadbalancer.server.port: "8001"
    restart: unless-stopped
    networks:
      - default
      - traefik_network

  # The archive (docs/spec/archive.md), not started by a deploy:
  # `docker compose -f compose.yml --env-file .env --env-file .env.deploy --profile archive up -d archive`.
  archive:
    <<: *app
    command: python -m archive
    profiles: ["archive"]
    volumes:
      - ./logs:/app/logs
      - ./bot.ini:/app/bot.ini
      - ./config.ini:/app/config.ini
      - ./cogs.ini:/app/cogs.ini
      - ./database.ini:/app/database.ini
      - ./sentry.ini:/app/sentry.ini
      - ./archive.ini:/app/archive.ini
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  default:
  traefik_network:
    external: true
