services:

  redis:
    image: redis:8.2.4-alpine3.22
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default
    restart: "no"

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: "no"
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default

  postgres:
    image: postgres:14-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: winter_dragon
      PGUSER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d winter_dragon"]
      interval: 5s
      timeout: 30s
      retries: 6
      start_period: 10s
    restart: "no"
    networks:
      - default

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/winter_dragon
    volumes:
      # Development mounts for all packages
      - ./src:/app/src
      - ./wd-bot/src:/app/wd-bot/src
      - ./wd-config/src:/app/wd-config/src
      - ./wd-core/src:/app/wd-core/src
      - ./wd-db/src:/app/wd-db/src
      - ./wd-discord/src:/app/wd-discord/src
      - ./wd-errors/src:/app/wd-errors/src
      - ./wd-types/src:/app/wd-types/src
      - ./wd-cogs/src:/app/wd-cogs/src
      - ./config.ini:/app/config.ini
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m winter_dragon.workers
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/winter_dragon
    volumes:
      # Development mounts for all packages
      - ./src:/app/src
      - ./wd-bot/src:/app/wd-bot/src
      - ./wd-config/src:/app/wd-config/src
      - ./wd-core/src:/app/wd-core/src
      - ./wd-db/src:/app/wd-db/src
      - ./wd-discord/src:/app/wd-discord/src
      - ./wd-errors/src:/app/wd-errors/src
      - ./wd-types/src:/app/wd-types/src
      - ./wd-cogs/src:/app/wd-cogs/src
      - ./config.ini:/app/config.ini
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - default

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
    restart: "no"

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: "no"
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m winter_dragon.api
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/winter_dragon
      REDIS_HOST: redis
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:3000}
    volumes:
      # Development mounts for all packages
      - ./src:/app/src
      - ./wd-bot/src:/app/wd-bot/src
      - ./wd-config/src:/app/wd-config/src
      - ./wd-core/src:/app/wd-core/src
      - ./wd-db/src:/app/wd-db/src
      - ./wd-discord/src:/app/wd-discord/src
      - ./wd-errors/src:/app/wd-errors/src
      - ./wd-types/src:/app/wd-types/src
      - ./wd-cogs/src:/app/wd-cogs/src
      - ./config.ini:/app/config.ini
      - ./logs:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - default

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    driver: bridge
