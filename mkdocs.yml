site_name: Winter Dragon
site_description: A versatile Discord bot with moderation, utility, and entertainment features
site_author: HEROgold
site_url: https://github.com/HEROgold/Winter-Dragon-Bot

repo_name: Winter-Dragon-Bot
repo_url: https://github.com/HEROgold/Winter-Dragon-Bot
edit_uri: edit/v2/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select

plugins:
  - search
  - include-markdown

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Features (main branch):
      - Overview: features/index.md
      - Bot Core: features/bot-core.md
      - Moderation & Logging: features/moderation.md
      - Server Management: features/server-management.md
      - Games: features/games.md
      - User Tools: features/user-tools.md
      - Platform & Services: features/platform.md
  - User Guide:
      - Getting Started: guide/getting-started.md
      - Frontend: guide/frontend.md
      - API Usage: guide/api-usage.md
  - Development:
      - Architecture: dev/architecture.md
      - Setup: dev/setup.md
      - Database: dev/database.md
  - API Reference: api-reference.md
